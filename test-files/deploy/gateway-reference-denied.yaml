apiVersion: v1
kind: Service
metadata:
  name: echo-denied
  namespace: kiali-validation-backends
spec:
  selector:
    app: validation-echo
    version: v1
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: validation-reference-denied
  namespace: kiali-validation
spec:
  parentRefs:
    - name: validation-gateway
      sectionName: http
  hostnames: ["denied.validation.invalid"]
  rules:
    - backendRefs:
        - name: echo-denied
          namespace: kiali-validation-backends
          port: 80
