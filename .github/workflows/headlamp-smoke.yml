name: Headlamp plugin checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run tsc
      - run: npm run lint
      - run: CI=1 npm test
      - run: npm run parity:check
      - run: npm run build
      - run: npm run smoke:hosted
        env:
          HEADLAMP_SMOKE_ARTIFACTS: ${{ runner.temp }}/headlamp-kiali-smoke-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: headlamp-smoke-failure
          path: ${{ runner.temp }}/headlamp-kiali-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7
